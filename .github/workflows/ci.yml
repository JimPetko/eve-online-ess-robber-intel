name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the server image
        run: docker build -t ess-robber-intel .
      - name: The image serves /api/health
        run: |
          docker run -d --name ess -p 3917:3917 ess-robber-intel
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3917/api/health && exit 0; sleep 1; done
          docker logs ess; exit 1

  tests-required:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Behaviour changes ship with tests
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-tests-needed') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/tests-required.mjs "$BASE_SHA" "$HEAD_SHA"
      - name: Waived by no-tests-needed label
        if: ${{ contains(github.event.pull_request.labels.*.name, 'no-tests-needed') }}
        run: echo "no-tests-needed label set; check waived"
