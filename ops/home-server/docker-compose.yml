name: ess-robber-intel

services:
  server:
    build: ../..
    image: ess-robber-intel
    restart: unless-stopped
    # No published port: the tailscale service below is the only way in, so no client can skip it
    # and forge X-Forwarded-For.
    environment:
      TZ: UTC
      # Trust the one proxy in front (the tailscale service) for the client IP and https.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - ess-data:/data
    # main.ts waits up to 10 s for a sync in progress.
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Joins the tailnet as its own machine and publishes the server through Funnel at
  # https://ess-robber-intel.<tailnet>.ts.net. Userspace networking, so it needs no extra privileges.
  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    hostname: ess-robber-intel
    restart: unless-stopped
    environment:
      TS_HOSTNAME: ess-robber-intel
      # Only needed for the first start; the node's identity then lives in ts-state.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    depends_on:
      - server
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  ess-data:
  ts-state:
