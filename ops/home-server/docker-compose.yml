name: ess-robber-intel

services:
  server:
    build: ../..
    image: ess-robber-intel
    restart: unless-stopped
    ports:
      # The UI has no login: this publishes it to the LAN. Use "127.0.0.1:3917:3917" to keep it on the host.
      - "${ESS_PORT:-3917}:3917"
    environment:
      TZ: UTC
      # Set TRUST_PROXY=1 in .env only when an HTTPS reverse proxy is the sole way in (see README).
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - ess-data:/data
    # main.ts waits up to 10 s for a sync in progress.
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  ess-data:
