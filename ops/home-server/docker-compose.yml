name: ess-robber-intel

services:
  server:
    build: ../..
    image: ess-robber-intel
    restart: unless-stopped
    ports:
      # Host-only: Tailscale Funnel on the host is the one way in (see README). Binding beyond
      # 127.0.0.1 would let a client skip the proxy and forge X-Forwarded-For.
      - "127.0.0.1:${ESS_PORT:-3917}:3917"
    environment:
      TZ: UTC
      # Trust the one proxy in front (Funnel) for the client IP and https.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - ess-data:/data
    # main.ts waits up to 10 s for a sync in progress.
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  ess-data:
